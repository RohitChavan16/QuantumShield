name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "feat/**", "fix/**" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - name: Go Vet
        run: go vet ./...
      - name: Go Build
        run: go build ./...
      - name: Go Test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: NPM Install
        run: npm ci
      - name: NPM Lint
        run: npm run lint
      - name: NPM Build
        run: npm run build
